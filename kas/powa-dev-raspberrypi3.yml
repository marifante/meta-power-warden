header:
  version: 18
  includes:
    - powa-base-layers.yml

machine: raspberrypi3
target: powa-dev-image
distro: powa

# linux-firmware-rpidistro-bcm43455 needs synaptics-killswitch license to be accepted.
# TODO: rm_work_and_downloads should be moved to a more common place
local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work_and_downloads"
  license: |
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
