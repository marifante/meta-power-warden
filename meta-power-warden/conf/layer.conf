# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "power-warden"
BBFILE_PATTERN_power-warden = "^${LAYERDIR}/"
BBFILE_PRIORITY_power-warden = "6"

LAYERDEPENDS_power-warden = "core openembedded-layer virtualization-layer"
LAYERSERIES_COMPAT_power-warden = "walnascar"
