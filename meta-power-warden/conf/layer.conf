# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-power-warden"
BBFILE_PATTERN_meta-power-warden = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-power-warden = "6"

LAYERDEPENDS_meta-power-warden = "core"
LAYERSERIES_COMPAT_meta-power-warden = "walnascar"
